name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, fileinfo, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ffmpeg para que también se ejecute el test de procesado de audio real
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo de código (Pint)
        run: vendor/bin/pint --test

      - name: Auditoría de dependencias
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Compilar el frontend
        run: |
          npm ci
          npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
